name: "CI: Validate & Build Main"

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZ_CONTAINER_NAME: "microservice-ticketing"
  CONTAINER_VERSION_TAG: ${{ github.sha }}

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: Install dependencies
        run: deno install
        
      - name: Deno check
        run: deno check src/
        
      - name: Deno lint
        run: deno lint src
        
      - name: Run unit tests
        run: deno test --allow-all
          
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Run tests with coverage
        run: deno test --coverage=coverage --allow-all

      - name: Check coverage threshold
        run: |
          coverage_report="$(deno coverage --exclude=tests coverage)"
          echo "$coverage_report"
          
          COVERAGE="$(echo "$coverage_report" | grep "All files" | awk -F'|' '{print $3}' | sed 's/\x1B\[[0-9;]*m//g' | tr -d '[:space:]' | tr -d '%')"
          COVERAGE_INT="${COVERAGE%.*}"
          
          echo "Determined Coverage: $COVERAGE_INT%"
          
          if [[ $COVERAGE_INT -lt 95 ]]; then
            echo "Error: Code coverage ($COVERAGE_INT%) is below the required threshold of 95%"
            exit 1
          fi
          
          echo "Success: Code coverage meets threshold!"

  build:
    name: Push Docker image to Azure Container Registry
    runs-on: ubuntu-latest
    environment: production
    needs: code-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'    

    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to registry ${{ vars.HOWESTPRIME_AZ_CONTAINER_REGISTRY }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.HOWESTPRIME_AZ_CONTAINER_REGISTRY }}
          username: ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }}
          password: ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: config/Dockerfile
          push: true
          tags: ${{ vars.HOWESTPRIME_AZ_CONTAINER_REGISTRY }}/${{ env.AZ_CONTAINER_NAME }}:${{ env.CONTAINER_VERSION_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions: {}
    steps:
      - name: Log in to Azure
        run: az login --service-principal --username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} --password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} --tenant ${{ vars.AZ_TENANT_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
          --name ${{ env.AZ_CONTAINER_NAME }} \
          --resource-group ${{ vars.HOWESTPRIME_AZ_RESOURCE_GROUP }} \
          --environment ${{ vars.HOWESTPRIME_AZ_CONTAINER_ENVIRONMENT }} \
          --image ${{ vars.HOWESTPRIME_AZ_CONTAINER_REGISTRY }}/${{ env.AZ_CONTAINER_NAME }}:${{ env.CONTAINER_VERSION_TAG }} \
          --registry-server ${{ vars.HOWESTPRIME_AZ_CONTAINER_REGISTRY }} \
          --registry-username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} \
          --registry-password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} \
          --user-assigned "${{ vars.HOWESTPRIME_MID_KEYVAULTREADER_ID }}" \
          \
          --secrets \
          "db-password=keyvaultref:${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_PASSWORD_URI }},identityref:${{ vars.HOWESTPRIME_WIDE_MID_KEYVAULTREADER_URI }}" \
          "mb-password=keyvaultref:${{ vars.HOWESTPRIME_WIDE_MESSAGEBROKER_PASSWORD_URI }},identityref:${{ vars.HOWESTPRIME_WIDE_MID_KEYVAULTREADER_URI }}" \
          \
          --env-vars \
          "PERSISTENCE_MONGO_DB_PROTOCOL=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_PROTOCOL }}" \
          "PERSISTENCE_MONGO_DB_USER=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_LOGIN }}" \
          "PERSISTENCE_MONGO_DB_PORT=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_PORT }}" \
          "PERSISTENCE_MONGO_DB_HOST=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_HOST }}" \
          "PERSISTENCE_MONGO_DB_NAME=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_DB }}" \
          "PERSISTENCE_MONGO_DB_OPTIONS=${{ vars.HOWESTPRIME_TICKETING_DOCUMENTDB_OPTIONS }}" \
          "PERSISTENCE_MONGO_DB_PASS=secretref:db-password" \
          "MESSAGING_LAVINMQ_HOSTNAME=${{ vars.HOWESTPRIME_WIDE_MESSAGEBROKER_HOSTNAME }}" \
          "MESSAGING_LAVINMQ_VHOST=${{ vars.HOWESTPRIME_WIDE_MESSAGEBROKER_VHOST }}" \
          "MESSAGING_LAVINMQ_PASS=secretref:mb-password" \
          "MESSAGING_LAVINMQ_USER=${{ vars.HOWESTPRIME_WIDE_MESSAGEBROKER_LOGIN }}" \
          "MESSAGING_LAVINMQ_ASYNCAPI_PATH=${{ vars.HOWESTPRIME_TICKETING_ASYNCAPI_URI }}" \
          "WEBAPI_PORT=${{ vars.HOWESTPRIME_TICKETING_WEBAPI_PORT }}" \
          "WEBAPI_HOST=${{ vars.HOWESTPRIME_TICKETING_WEBAPI_HOST }}" \

          az containerapp ingress enable \
          --name ${{ env.AZ_CONTAINER_NAME }} \
          --resource-group ${{ vars.HOWESTPRIME_AZ_RESOURCE_GROUP }} \
          --type external \
          --target-port 8000